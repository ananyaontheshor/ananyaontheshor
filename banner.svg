      .s23 { animation: tw 4.3s ease-in-out infinite 2.2s; }
      .s24 { animation: tw 2.0s ease-in-out infinite 1.0s; }
      @keyframes tw     { 0%,100%{ opacity:0.06; } 50%{ opacity:1; } }
      @keyframes blink  { 0%,100%{ opacity:1; } 50%{ opacity:0; } }
      @keyframes glitch {
        0%,89%,100% { transform:translate(0,0); opacity:1; }
        90% { transform:translate(-2px,0); opacity:0.85; }
        91% { transform:translate(2px,0);  opacity:0.95; }
        92% { transform:translate(0,0);    opacity:1; }
      }
